[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-chatgpt-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy that serves paperless-ngx from a ChatGPT plan instead of API credits"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "setuptools==83.0.0"]

[project.scripts]
chatgpt-proxy = "chatgpt_proxy.__main__:main"

[tool.setuptools]
packages = ["chatgpt_proxy"]
